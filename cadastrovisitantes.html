<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar visitante · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="cadastro" data-title="Cadastrar visitante">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="content">
        <header class="topbar" id="topbar"></header>

        <main>
            <div class="page-head">
                <h1 id="formTitle">Cadastrar visitante</h1>
                <p id="formLead">Preencha os dados de quem está nos visitando hoje.</p>
            </div>

            <form id="visitorForm" class="panel form-narrow form-grid">
                <div class="field full">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" autocomplete="off" required>
                </div>

                <div class="field">
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="city" autocomplete="off" required>
                </div>

                <fieldset class="field">
                    <legend>É evangélico?</legend>
                    <div class="segmented">
                        <input type="radio" id="evangelicalYes" name="evangelical" value="Sim" required>
                        <label for="evangelicalYes">Sim</label>
                        <input type="radio" id="evangelicalNo" name="evangelical" value="Não">
                        <label for="evangelicalNo">Não</label>
                    </div>
                </fieldset>

                <div class="field full" id="churchSection" hidden>
                    <label for="churchName">Igreja de origem</label>
                    <input type="text" id="churchName" name="churchName" autocomplete="off">
                </div>

                <div class="form-actions full">
                    <button type="submit" class="btn btn-primary"><span id="submitLabel">Cadastrar</span></button>
                    <a href="listavisitantes.html" class="btn btn-ghost">Ver lista</a>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
