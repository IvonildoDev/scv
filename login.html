<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
    <link rel="icon" href="imagem/logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css?v=8">
</head>

<body data-page="login" data-title="Entrar">
    <main class="login-wrap">
        <section class="login-hero">
            <svg aria-hidden="true" viewBox="0 0 400 520">
                <path d="M40 520V230C40 120 110 40 200 40S360 120 360 230V520" fill="none" stroke="#1f4287" stroke-width="28"/>
                <path d="M100 520V240C100 160 140 100 200 100S300 160 300 240V520" fill="none" stroke="#d9972b" stroke-width="10"/>
            </svg>
            <span class="eyebrow">Recepção</span>
            <div>
                <h2>Cada visitante é recebido com cuidado.</h2>
                <p>Registre quem nos visita, acompanhe a lista do dia e gere o relatório em PDF para a liderança.</p>
            </div>
            <span class="small">Acesso restrito à equipe de recepção.</span>
        </section>
        <div class="login-side">
        <form id="loginForm" class="panel login-card">
            <div class="logo-crop"><img src="imagem/logo.png" alt="SCV — Sistema de Cadastro de Visitantes"></div>
            <h1>Entrar</h1>
            <p class="login-lead">Informe quem está na recepção. Os nomes aparecerão nas telas e nos relatórios.</p>

            <div class="field">
                <label for="congregation">Congregação</label>
                <input type="text" id="congregation" name="congregation" placeholder="Ex.: AD Sede" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="recName">Recepcionista 1</label>
                <input type="text" id="recName" name="recName" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="recName2">Recepcionista 2</label>
                <input type="text" id="recName2" name="recName2" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary login-submit">Entrar</button>
        </form>
        </div>
    </main>

    <script src="script.js?v=8"></script>
</body>

</html>
