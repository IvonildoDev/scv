<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=5">
</head>

<body data-page="login" data-title="Entrar">
    <main class="login-wrap">
        <form id="loginForm" class="panel login-card">
            <img src="logo.svg" alt="" width="56" height="56">
            <h1>SCV</h1>
            <p class="login-lead">Informe quem está na recepção. Os nomes aparecerão nas telas e nos relatórios.</p>

            <div class="field">
                <label for="recName">Recepcionista 1</label>
                <input type="text" id="recName" name="recName" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="recName2">Recepcionista 2</label>
                <input type="text" id="recName2" name="recName2" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary login-submit">Entrar</button>
        </form>
    </main>

    <script src="script.js?v=5"></script>
</body>

</html>
