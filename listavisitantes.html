<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitantes · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=3">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>

<body data-page="lista" data-title="Visitantes">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="content">
        <header class="topbar" id="topbar"></header>

        <main>
            <div class="page-head">
                <h1>Visitantes</h1>
                <p>Todos os visitantes cadastrados, do mais recente ao mais antigo.</p>
            </div>

            <div class="toolbar">
                <div class="search">
                    <span data-icon="search"></span>
                    <input type="search" id="searchVisitor" placeholder="Buscar por nome, cidade ou igreja" aria-label="Buscar visitante">
                </div>
                <span class="spacer"></span>
                <button class="btn btn-ghost" id="generatePDF"><span data-icon="download"></span>Baixar PDF</button>
                <button class="btn btn-ghost" id="sharePDF"><span data-icon="share"></span>Compartilhar</button>
                <button class="btn btn-quiet-danger" id="clearAll"><span data-icon="trash"></span>Apagar tudo</button>
            </div>

            <p class="count" id="count" aria-live="polite"></p>

            <div class="table-wrap" id="tableWrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cidade</th>
                            <th>Igreja</th>
                            <th>Cargo</th>
                            <th>Cadastro</th>
                            <th><span class="sr-only">Ações</span></th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="table-wrap empty" id="emptyState" hidden></div>
        </main>
    </div>

    <script src="script.js?v=3"></script>
</body>

</html>
