<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="contato" data-title="Contato">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="content">
        <header class="topbar" id="topbar"></header>

        <main>
            <div class="page-head">
                <h1>Contato</h1>
                <p>Dúvidas, sugestões ou algum problema no sistema? Fale com a gente.</p>
            </div>

            <div class="channels" id="channels"></div>

            <form id="contactForm" class="panel form-narrow">
                <h2 style="font-size: 20px; margin-bottom: 18px;">Enviar uma mensagem</h2>
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="email">Seu e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="subject">Assunto</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="field">
                    <label for="message">Mensagem</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><span data-icon="mail"></span>Enviar por e-mail</button>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
