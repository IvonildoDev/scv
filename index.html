<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início · SCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="home" data-title="Início">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="content">
        <header class="topbar" id="topbar"></header>

        <main>
            <div class="page-head">
                <h1>Visitantes</h1>
                <p>Registre quem nos visita e acompanhe o movimento.</p>
            </div>

            <blockquote class="verse">
                Alegrei-me quando me disseram: Vamos à Casa do Senhor!
                <cite>Salmos 122:1</cite>
            </blockquote>

            <div class="stats">
                <div class="stat"><b id="statTotal">0</b><span>Total de visitantes</span></div>
                <div class="stat"><b id="statMonth">0</b><span>Cadastrados neste mês</span></div>
                <div class="stat"><b id="statEvangelical">0</b><span>Já são evangélicos</span></div>
            </div>

            <div class="quick">
                <a class="btn btn-primary" href="cadastrovisitantes.html"><span data-icon="plus"></span>Cadastrar
                    visitante</a>
                <a class="btn btn-ghost" href="listavisitantes.html"><span data-icon="users"></span>Ver todos</a>
            </div>

            <div class="section-head">
                <h2>Últimos cadastros</h2>
            </div>
            <div class="table-wrap" id="recent"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
